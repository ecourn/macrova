# Recette synthétique uniquement. Publication manuelle du commit validé.
services:
  - type: web
    name: macrova-socle-test
    runtime: node
    plan: free
    region: frankfurt
    rootDir: app
    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: bun run start
    autoDeployTrigger: off
    previews:
      generation: off
    envVars:
      - key: BUN_VERSION
        value: 1.4.2
      - key: NODE_VERSION
        value: 24.21.0
      - key: NITRO_PRESET
        value: render-com
      - key: HOST
        value: 0.0.0.0
      - key: VITE_CONVEX_URL
        value: https://dazzling-puffin-856.convex.cloud
      - key: VITE_CONVEX_SITE_URL
        value: https://dazzling-puffin-856.convex.site
      - key: VITE_SITE_URL
        sync: false
