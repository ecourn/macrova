[[entry]]
id = 5
type = "story"
title = "Mesurer les calculs terminés sans profil"
description = "Relier les résultats valides de 2.4 au contrat calculator_completed de 1.4 par un collecteur Convex public à enveloppe fermée, déduplication par eventId, protection contre les envois abusifs, purge à 30 jours et bilan réservé à l'exploitation, sans profil ni dépendance du calcul à la collecte."
verify = "Vérifier qu'un calcul et une modification valides émettent chacun une intention distincte, qu'un rendu ou retour ou échec n'émet rien, que le retry du même eventId compte une fois, que les champs supplémentaires et accès au bilan sont refusés qu'une panne de collecte laisse le résultat gratuit utilisable, puis avancer l'horloge pour vérifier la purge à 30 jours et exercer la protection documentée contre les envois abusifs."
covers = ["CAL-5", "CAL-7"]
after = [4, "1.4"]
hitl = false
risk = "medium"
unknown = "Les mesures navigateur déclarent un usage sans prouver une personne distincte ; documenter les limites de fiabilité et faire vérifier la politique de conservation avant ouverture publique."
plan_checkpoint = false
done_checkpoint = false

