[[entry]]
id = 1
type = "story"
title = "Documenter et valider la méthode estimative"
description = "Constituer le dossier versionné de méthode et de répartition calories/P/G/L à partir de sources primaires vérifiées, arrêter ses entrées, exclusions et règles de modification avec exemples de référence, puis obtenir et consigner la validation datée du responsable avant toute implémentation automatique."
verify = "Relire le dossier sourcé, reproduire indépendamment les exemples et cas limites, vérifier la matrice d'exclusions et la règle de recalcul, puis constater la preuve explicite de validation couvrant ces éléments."
covers = ["CAL-1", "CAL-3", "CAL-4"]
after = []
hitl = true
risk = "high"
unknown = "Aucune formule, répartition ni exclusion n'est sélectionnée ; le responsable de validation et son accord réel doivent être obtenus ici."
plan_checkpoint = false
done_checkpoint = true

[[entry]]
id = 2
type = "story"
title = "Relier le premier calcul public à la méthode validée"
description = "À partir du dossier approuvé de 2.1 et des décimales de 1.2, relier l'accueil au formulaire shadcn du calculateur et à son domaine pur en mémoire, afficher les quatre résultats et hypothèses d'un cas valide, avec refus préalable des cas invalides ou exclus, état sans estimation si la méthode manque et entrée SSR indépendante de l'auth distante, en adaptant les sondes et tests touchés sans masquer les erreurs privées."
verify = "Depuis l'accueil sans compte, obtenir le résultat de référence approuvé, retrouver unités et hypothèses, constater l'absence d'estimation pour méthode absente ou entrée invalide ou exclue, inspecter réseau, URL et stockages pour vérifier qu'aucun profil ne quitte la mémoire du parcours, puis simuler une panne auth/Convex dès l'entrée SSR et vérifier l'accès public et la remontée distincte des erreurs privées."
covers = ["CAL-2", "CAL-3", "CAL-5", "CAL-6"]
after = [1, "1.1", "1.2"]
hitl = false
risk = "high"
unknown = "Le formulaire et les calculs exacts dépendent uniquement des décisions approuvées de 2.1 ; réutiliser AD-12 sans modifier localement ses limites et prendre en charge explicitement les intermédiaires signés si la méthode les exige."
plan_checkpoint = false
done_checkpoint = false

