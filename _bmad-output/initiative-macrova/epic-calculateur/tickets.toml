verify = "Exécuter la matrice approuvée de cas limites et exclus, notamment les décimales françaises et valeurs non prises en charge, puis modifier un résultat valide en entrée refusée et vérifier qu'aucun ancien résultat actuel ne subsiste et que les saisies restent corrigeables."
covers = ["CAL-3", "CAL-5", "CAL-6"]
