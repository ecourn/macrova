title = "Constituer le corpus reproductible et auditer Open Food Facts"
description = "Constituer cinquante requêtes techniques distinctes et justifiées, réaliser un audit OFF sourcé et horodaté avec captures et replay reproductible, classer disponibilité, complétude, unités, états, provenance et limites numériques puis documenter les exemples et décisions nécessaires au catalogue sans collecte utilisateur."
verify = "Contrôler CAT-1 à CAT-3 sur le manifeste et les captures réelles, reproduire les classifications hors réseau, tester absence versus zéro et conversions ambiguës avec cas négatifs séparés, puis consigner les échecs, limites et actions avant gel sans revendiquer une couverture représentative ni un moteur livré."
covers = ["CAT-1", "CAT-2", "CAT-3"]
