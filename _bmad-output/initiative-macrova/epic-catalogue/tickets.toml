description = "Créer le module catalogue et sa surface Aliments accessible dans l’espace personnel isolé, relier une soumission texte à Search-a-licious via action Convex, réutiliser le normaliseur audité pour afficher liste et détail source sans nutrition inventée, et fournir dès ce parcours les contrats de résultat, gardes du socle, réservations de budget, déduplication des appels identiques en vol sans cache ni reprise générale des réservations, et suspension nécessaires aux étapes suivantes en réutilisant contrat v1 et parsing/normalisation de l’audit."
verify = "Sur le backend isolé avec droit de test, exécuter une recherche et ouvrir un détail sourcé, vérifier par tests les appels uniquement à la soumission, liste vide distincte de panne, rejet des données ambiguës, attribution et absence de données privées envoyées, puis prouver que concurrence et 429/503 respectent budgets et suspension sans retry automatique."
covers = ["CAT-4", "CAT-5", "CAT-6", "CAT-8"]
after = [1, "1.2", "1.3"]
hitl = false
risk = "high"
unknown = "Disponibilité et configuration texte à recontrôler au démarrage avec preuves datées ; staging/fixtures pour tests répétables, observation réelle distincte et panne explicitement recevable."
